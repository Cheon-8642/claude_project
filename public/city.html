<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도시 날씨</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="effects.css">
</head>
<body>
  <!-- 비·눈·안개가 화면 전체에 그려지는 층 (클릭을 막지 않아요) -->
  <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>

  <main class="app">
    <a href="index.html" class="back-link">← 다른 나라 찾기</a>

    <p id="source-badge" class="badge hidden"></p>
    <p id="preview-badge" class="badge preview hidden"></p>

    <p id="message" class="message">불러오는 중...</p>

    <!-- 현재 날씨 -->
    <section id="current" class="current hidden">
      <h1 id="place" class="place"></h1>
      <p id="country" class="country"></p>
      <div class="current-main">
        <span id="current-icon" class="big-icon"></span>
        <span id="current-temp" class="big-temp"></span>
      </div>
      <p id="current-desc" class="desc"></p>
      <div class="details">
        <div><span class="label">습도</span><span id="humidity"></span></div>
        <div><span class="label">바람</span><span id="wind"></span></div>
      </div>
    </section>

    <section id="forecast-section" class="hidden">
      <h2>5일 예보</h2>
      <div id="forecast" class="forecast"></div>
    </section>

    <!-- 이 나라의 역사: 오늘의 역사가 먼저, 그 아래에 이번 주의 역사 -->
    <section id="history-section" class="history-section">
      <div class="history-block">
        <h2 class="history-tab">오늘의 역사 <span id="today-label" class="history-when"></span></h2>
        <p id="today-message" class="history-message">데이터를 찾는 중입니다.</p>
        <ul id="today-list" class="history-list"></ul>
      </div>
      <div class="history-block">
        <h2 class="history-tab">이번 주의 역사 <span id="week-label" class="history-when"></span></h2>
        <p id="week-message" class="history-message">찾는 중입니다.</p>
        <ul id="week-list" class="history-list"></ul>
      </div>
    </section>

    <footer class="credit">
      날씨 정보: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> ·
      역사 정보: <a href="https://www.wikidata.org/" target="_blank" rel="noopener">Wikidata</a>, 한국어 위키백과
    </footer>
  </main>

  <script src="common.js"></script>
  <script src="effects.js"></script>
  <script src="city.js"></script>
</body>
</html>
